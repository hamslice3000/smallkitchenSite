<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <script src="https://product-gallery.cloudinary.com/latest/all.js" type="text/javascript"></script>
    <script src="/config.js" type="text/javascript"></script>
    <!-- POC works in render.com -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: #fff;
        }
        /* basic mobile works */
        #my-gallery {
            width: min(100%, 1100px);
            margin: 0 auto;
            touch-action: pinch-zoom;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            #my-gallery {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="my-gallery"></div>
    <!-- Admin API for media access -->
    <script type="text/javascript">
        const cloudName = window.__APP_CONFIG__?.CLOUDINARY_CLOUD_NAME || "";
        const folderName = "smallkitchen";

        async function fetchGalleryPublicIds(folder) {
            const response = await fetch(`/gallery-assets?folder=${encodeURIComponent(folder)}`);

            if (!response.ok) {
                throw new Error(`Asset lookup failed with status ${response.status}`);
            }

            const payload = await response.json();
            const resources = Array.isArray(payload.resources) ? payload.resources : [];
            return resources
                .map((resource) => resource && resource.public_id)
                .filter((publicId) => typeof publicId === "string" && publicId.length > 0)
                .slice(0, 10);
        }

        async function renderGalleryFromFolder() {
            const container = document.getElementById("my-gallery");

            if (!cloudName) {
                container.textContent = "Cloudinary cloud name is not configured. Set CLOUDINARY_CLOUD_NAME in your server environment.";
                return;
            }

            try {
                //fetch Public IDs
                const publicIds = await fetchGalleryPublicIds(folderName);

                if (!publicIds.length) {
                    container.textContent = `No assets found in folder: ${folderName}`;
                    return;
                }
                // Cloudinary Gallery Widget
                const myGallery = cloudinary.galleryWidget({
                    container: "#my-gallery",
                    cloudName,
                    sort: "none",
                    mediaAssets: publicIds.map((publicId) => ({ publicId }))
                });

                myGallery.render();
            } catch (error) {
                container.textContent = `Unable to load gallery assets: ${error.message}`;
            }
        }

        renderGalleryFromFolder();
    </script>
</body>
</html>
