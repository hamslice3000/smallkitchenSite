<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/config.js" type="text/javascript"></script>
    <style>
        :root {
            --ink: #13212f;
            --mist: #eaf6ff;
            --card: #f7fbff;
            --accent: #f25f3a;
            --accent-soft: #ffd9cf;
            --line: #cddfea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 5% 10%, #ffe5d8 0%, transparent 32%),
                radial-gradient(circle at 96% 92%, #d5ecff 0%, transparent 38%),
                linear-gradient(180deg, #ffffff 0%, #f1f7fb 100%);
        }

        .page-shell {
            width: min(1200px, 100%);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 8px;
            letter-spacing: 0.12em;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #47647d;
        }

        .title {
            margin: 0 0 20px;
            font-size: clamp(24px, 4vw, 48px);
            line-height: 1.05;
            letter-spacing: -0.02em;
            max-width: 18ch;
        }

        #status {
            margin-bottom: 16px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #ffffff;
        }

        #my-gallery {
            width: 100%;
        }

        .grid-wall {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0;
            align-items: start;
            overflow: visible;
            background: transparent;
        }

        .grid-item {
            position: relative;
            display: block;
            width: 100%;
            appearance: none;
            padding: 0;
            border: 0;
            border-radius: 0;
            overflow: hidden;
            cursor: pointer;
            background: #dbe9f2;
            aspect-ratio: var(--aspect-ratio, 1);
            box-shadow: 0 16px 36px rgba(19, 33, 47, 0.12);
            transform-origin: center center;
            transition: transform 340ms cubic-bezier(0.22, 1, 0.36, 1), filter 260ms ease, box-shadow 260ms ease;
            will-change: transform;
        }

        .grid-item:hover,
        .grid-item:focus-visible {
            outline: 2px solid transparent;
        }

        .grid-thumb {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: saturate(0.94) contrast(1.01);
            transition: filter 300ms ease, transform 340ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .grid-wall.is-hovering .grid-item:not(.is-focused) .grid-thumb {
            filter: saturate(0.76) brightness(0.96);
        }

        .grid-item.is-focused .grid-thumb {
            filter: saturate(1.05) contrast(1.08);
            transform: scale(1.02);
        }

        .grid-item.is-focused {
            box-shadow: 0 22px 48px rgba(19, 33, 47, 0.18);
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .grid-wall {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <h1 class="title">smallkitchen</h1>
        <div id="status"></div>
        <div id="my-gallery">
            <div class="grid-wall" id="grid-wall"></div>
        </div>
    </div>
    <script type="text/javascript">
        const cloudName = window.__APP_CONFIG__?.CLOUDINARY_CLOUD_NAME || "";
        const folderName = "smallkitechen";

        function encodePublicId(publicId) {
            return publicId
                .split("/")
                .map((segment) => encodeURIComponent(segment))
                .join("/");
        }

        function cloudinaryImageUrl(publicId, transform) {
            return `https://res.cloudinary.com/${cloudName}/image/upload/${transform}/${encodePublicId(publicId)}`;
        }

        function cloudinarySrcSet(publicId, widths) {
            return widths
                .map((width) => {
                    const transform = `a_auto,c_limit,w_${width},dpr_auto,q_auto,f_auto`;
                    return `${cloudinaryImageUrl(publicId, transform)} ${width}w`;
                })
                .join(", ");
        }

        function galleryImageSizes() {
            return "(max-width: 768px) 50vw, (max-width: 1200px) 25vw, 220px";
        }

        async function fetchGalleryAssets(folder) {
            const response = await fetch(`/gallery-assets?folder=${encodeURIComponent(folder)}`);

            if (!response.ok) {
                throw new Error(`Asset lookup failed with status ${response.status}`);
            }

            const payload = await response.json();
            const resources = Array.isArray(payload.resources) ? payload.resources : [];
            return resources
                .map((resource) => ({
                    publicId: resource && resource.public_id,
                    width: Number(resource && resource.width),
                    height: Number(resource && resource.height)
                }))
                .filter((asset) => typeof asset.publicId === "string" && asset.publicId.length > 0)
                .slice(0, 36);
        }

        async function fetchWithFolderFallback(primaryFolder, fallbackFolder) {
            try {
                const assets = await fetchGalleryAssets(primaryFolder);
                if (assets.length) {
                    return { assets, folderUsed: primaryFolder };
                }
            } catch (error) {
                // If primary lookup fails, we retry with a fallback folder name.
            }

            const fallbackAssets = await fetchGalleryAssets(fallbackFolder);
            return { assets: fallbackAssets, folderUsed: fallbackFolder };
        }

        function displayNameFromPublicId(publicId) {
            const chunk = publicId.split("/").pop() || publicId;
            return chunk.replace(/[-_]+/g, " ");
        }

        function setStatus(message) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.hidden = false;
        }

        function clearStatus() {
            const status = document.getElementById("status");
            status.hidden = true;
            status.textContent = "";
        }

        async function renderGridHoverGallery() {
            const gridWall = document.getElementById("grid-wall");

            if (!cloudName) {
                setStatus("Cloudinary cloud name is not configured. Set CLOUDINARY_CLOUD_NAME in your server environment.");
                return;
            }

            try {
                const { assets, folderUsed } = await fetchWithFolderFallback(folderName, "smallkitchen");

                if (!assets.length) {
                    setStatus(`No assets found in folder: ${folderName}`);
                    return;
                }

                clearStatus();

                if (folderUsed !== folderName) {
                    setStatus(`Using fallback folder: ${folderUsed}`);
                }

                const itemButtons = [];

                function clearHoverMotion() {
                    gridWall.classList.remove("is-hovering");
                    itemButtons.forEach((button) => {
                        button.classList.remove("is-focused");
                        button.style.transform = "";
                        button.style.zIndex = "";
                    });
                }

                function applyHoverMotion(focusIndex) {
                    const focusedButton = itemButtons[focusIndex];

                    if (!focusedButton) {
                        return;
                    }

                    const focusRect = focusedButton.getBoundingClientRect();
                    const fx = focusRect.left + focusRect.width / 2;
                    const fy = focusRect.top + focusRect.height / 2;

                    gridWall.classList.add("is-hovering");

                    itemButtons.forEach((button, index) => {
                        if (index === focusIndex) {
                            button.classList.add("is-focused");
                            button.style.zIndex = "8";
                            button.style.transform = "translate3d(0, 0, 0) scale(1.12)";
                            return;
                        }

                        button.classList.remove("is-focused");

                        const rect = button.getBoundingClientRect();
                        const bx = rect.left + rect.width / 2;
                        const by = rect.top + rect.height / 2;
                        const dx = bx - fx;
                        const dy = by - fy;
                        const distance = Math.hypot(dx, dy) || 1;
                        const push = Math.max(8, 34 - Math.min(24, distance / 28));
                        const tx = (dx / distance) * push;
                        const ty = (dy / distance) * push;

                        button.style.zIndex = "1";
                        button.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(0.96)`;
                    });
                }

                assets.forEach((asset, index) => {
                    const aspectRatio = asset.width > 0 && asset.height > 0
                        ? asset.width / asset.height
                        : 1;
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "grid-item";
                    button.setAttribute("aria-label", `Preview image ${index + 1}`);
                    button.style.setProperty("--aspect-ratio", String(aspectRatio));

                    const thumb = document.createElement("img");
                    thumb.className = "grid-thumb";
                    thumb.alt = displayNameFromPublicId(asset.publicId);
                    thumb.loading = "lazy";
                    thumb.sizes = galleryImageSizes();
                    thumb.srcset = cloudinarySrcSet(asset.publicId, [240, 360, 480, 720, 960]);
                    thumb.src = cloudinaryImageUrl(asset.publicId, "a_auto,c_limit,w_720,dpr_auto,q_auto,f_auto");
                    thumb.addEventListener("load", () => {
                        if (thumb.naturalWidth > 0 && thumb.naturalHeight > 0) {
                            button.style.setProperty("--aspect-ratio", String(thumb.naturalWidth / thumb.naturalHeight));
                        }
                    });

                    button.appendChild(thumb);
                    button.addEventListener("mouseenter", () => applyHoverMotion(index));
                    button.addEventListener("focus", () => applyHoverMotion(index));
                    button.addEventListener("click", () => applyHoverMotion(index));

                    itemButtons.push(button);
                    gridWall.appendChild(button);
                });

                gridWall.addEventListener("mouseleave", clearHoverMotion);
                gridWall.addEventListener("focusout", (event) => {
                    if (!gridWall.contains(event.relatedTarget)) {
                        clearHoverMotion();
                    }
                });
            } catch (error) {
                setStatus(`Unable to load gallery assets: ${error.message}`);
            }
        }

        renderGridHoverGallery();
    </script>
</body>
</html>
