<!DOCTYPE html>
<html>
<head>
    <script src="https://product-gallery.cloudinary.com/latest/all.js" type="text/javascript"></script>
</head>
<body>
    <div id="my-gallery" style="max-width:80%;margin:auto"></div>
    <script type="text/javascript">
        const myGallery = cloudinary.galleryWidget({
            container: "#my-gallery",
            cloudName: "demo",
            mediaAssets: [
                { tag: "electric_car_product_gallery_demo" }, // images (mediaType defaults to image)
                { tag: "electric_car_product_gallery_demo", mediaType: "video" }
            ]
        });
        myGallery.render();
    </script>
</body>
</html>
