<!DOCTYPE html>
<html>
    <!-- working stage -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/config.js" type="text/javascript"></script>
    <style>
        :root {
            --bg: #013012;
            --panel: #000000;
            --text: #E0EDA6;
            --muted: #9a9a9a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: "Space Grotesk", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .page-shell {
            width: min(1280px, 100%);
            margin: 0 auto;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .top-row {
            margin-bottom: 24px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .title {
            margin: 0;
            font-size: clamp(30px, 4vw, 54px);
            line-height: 1.02;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 10px 0 0;
            max-width: 62ch;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .hint {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 14px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        #status {
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 14px;
            color: #f1d2c7;
        }

        #my-gallery {
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            background: var(--panel);
            border-radius: 0;
            padding: 12px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .grid-stack {
            display: grid;
            gap: 0;
            border-radius: 0;
            overflow: hidden;
        }

        .grid-wall {
            display: grid;
            height: min(64vh, 760px);
            min-height: 420px;
            gap: 6px;
            overflow: hidden;
            border-radius: 0;
            background: var(--panel);
            transition: grid-template-columns 700ms cubic-bezier(.16, 1, .3, 1), grid-template-rows 700ms cubic-bezier(.16, 1, .3, 1);
        }

        .grid-item {
            position: relative;
            display: block;
            appearance: none;
            padding: 0;
            border: 0;
            border-radius: 0;
            overflow: hidden;
            cursor: pointer;
            background: #0b0b0b;
            isolation: isolate;
            touch-action: manipulation;
            transition: transform 700ms cubic-bezier(.16, 1, .3, 1), z-index 0s linear;
        }

        .grid-item:hover,
        .grid-item:focus-visible {
            outline: 2px solid transparent;
        }

        .grid-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: calc(50% + var(--touch-pan-x)) calc(50% + var(--touch-pan-y));
            display: block;
            --touch-pan-x: 0px;
            --touch-pan-y: 0px;
            --touch-zoom: 1;
            transform: scale(var(--touch-zoom));
            transition: transform 700ms cubic-bezier(.16, 1, .3, 1), filter 700ms cubic-bezier(.16, 1, .3, 1);
        }

        .grid-item::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 0.5px solid rgba(0, 0, 0, 0.65);
            pointer-events: none;
            z-index: 2;
        }

        .tile-label {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.45);
            color: #efefef;
            font-size: 12px;
            backdrop-filter: blur(8px);
            transform: translateY(8px);
            opacity: 0;
            transition: opacity 500ms ease, transform 500ms ease;
            z-index: 3;
        }

        .grid-item.is-focused .tile-label {
            opacity: 1;
            transform: translateY(0);
        }

        .grid-wall.is-hovering .grid-item:not(.is-focused) .grid-thumb {
            filter: brightness(0.75) saturate(0.75);
        }

        .grid-item.is-focused .grid-thumb {
            transform: scale(calc(var(--focus-scale, 1.06) * var(--touch-zoom)));
            filter: saturate(1.25);
        }

        .grid-item.is-focused {
            z-index: 20;
            transform: scale(1.015);
            touch-action: none;
        }

        .grid-item.is-touch-gesturing .grid-thumb {
            transition: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .top-row {
                margin-bottom: 18px;
            }

            .hint {
                display: none;
            }

            #my-gallery {
                border-radius: 0;
                padding: 8px;
            }

            .grid-wall {
                min-height: 360px;
                border-radius: 0;
            }

            .grid-stack {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="top-row">
            <div>
                <h1 class="title">smallkitchenuk</h1>
            </div>
            <div class="hint">Hover over the images</div>
        </div>
        <div id="status"></div>
        <div id="my-gallery">
            <div class="grid-stack" id="grid-stack"></div>
        </div>
    </div>
    <script type="text/javascript">
        const cloudName = window.__APP_CONFIG__?.CLOUDINARY_CLOUD_NAME || "";
        const folderName = "smallkitchen";
        const TILE_LAYOUT = [
            { id: 0, col: 1, row: 1, colSpan: 2, rowSpan: 2, label: "Portrait" },
            { id: 1, col: 3, row: 1, colSpan: 1, rowSpan: 2, label: "Figure" },
            { id: 2, col: 4, row: 1, colSpan: 1, rowSpan: 1, label: "Hands" },
            { id: 3, col: 1, row: 3, colSpan: 2, rowSpan: 1, label: "Reach" },
            { id: 4, col: 3, row: 3, colSpan: 1, rowSpan: 1, label: "Sky" },
            { id: 5, col: 4, row: 2, colSpan: 1, rowSpan: 2, label: "Landscape" }
        ];

        function encodePublicId(publicId) {
            return publicId
                .split("/")
                .map((segment) => encodeURIComponent(segment))
                .join("/");
        }

        function cloudinaryImageUrl(publicId, transform) {
            return `https://res.cloudinary.com/${cloudName}/image/upload/${transform}/${encodePublicId(publicId)}`;
        }

        function cloudinarySrcSet(publicId, widths, options = {}) {
            const cropMode = options.cropMode || "limit";
            const aspectRatioToken = options.aspectRatioToken || null;
            const gravity = options.gravity || null;

            return widths
                .map((width) => {
                    const transforms = ["a_auto", `c_${cropMode}`];

                    if (gravity) {
                        transforms.push(`g_${gravity}`);
                    }

                    if (aspectRatioToken) {
                        transforms.push(`ar_${aspectRatioToken}`);
                    }

                    transforms.push(`w_${width}`, "dpr_auto", "q_auto:best", "f_auto");
                    const transform = transforms.join(",");
                    return `${cloudinaryImageUrl(publicId, transform)} ${width}w`;
                })
                .join(", ");
        }

        function cloudinaryBestSrc(publicId, maxWidth, options = {}) {
            const cropMode = options.cropMode || "limit";
            const aspectRatioToken = options.aspectRatioToken || null;
            const gravity = options.gravity || null;
            const transforms = ["a_auto", `c_${cropMode}`];

            if (gravity) {
                transforms.push(`g_${gravity}`);
            }

            if (aspectRatioToken) {
                transforms.push(`ar_${aspectRatioToken}`);
            }

            transforms.push(`w_${maxWidth}`, "dpr_auto", "q_auto:best", "f_auto");
            return cloudinaryImageUrl(publicId, transforms.join(","));
        }

        function aspectRatioTokenForTile(tile) {
            return `${tile.colSpan}:${tile.rowSpan}`;
        }

        function focusScaleForImage(asset, tile) {
            const imageAspect = asset.width > 0 && asset.height > 0 ? asset.width / asset.height : 1;
            const tileAspect = tile.colSpan / tile.rowSpan;
            const mismatch = Math.max(imageAspect / tileAspect, tileAspect / imageAspect);

            if (mismatch >= 1.8) {
                return "1.0";
            }

            if (mismatch >= 1.35) {
                return "1.01";
            }

            return "1.03";
        }

        function srcSetWidthsForMax(maxWidth) {
            const roundedMax = Math.round(maxWidth);

            if (!Number.isFinite(roundedMax) || roundedMax <= 0) {
                return [960, 1280, 1600, 2000, 2400, 3000, 3600];
            }

            const baseCandidates = [960, 1280, 1600, 2000, 2400, 3000, 3600, 4200, 5200, 6400];
            const widths = baseCandidates.filter((width) => width < roundedMax);
            widths.push(roundedMax);

            return Array.from(new Set(widths)).sort((a, b) => a - b);
        }

        function galleryImageSizes() {
            return "(max-width: 768px) 48vw, (max-width: 1200px) 38vw, 70vw";
        }

        function tracksForAxis(hoveredTile, axis) {
            const count = axis === "col" ? 4 : 3;
            const base = Array(count).fill(1);

            if (!hoveredTile) {
                return base.map((value) => `${value}fr`).join(" ");
            }

            const start = axis === "col" ? hoveredTile.col : hoveredTile.row;
            const span = axis === "col" ? hoveredTile.colSpan : hoveredTile.rowSpan;
            const active = new Set(Array.from({ length: span }, (_, i) => start + i));

            return base
                .map((_, i) => {
                    const line = i + 1;
                    if (active.has(line)) {
                        return span > 1 ? "1.75fr" : "2.35fr";
                    }

                    return "0.72fr";
                })
                .join(" ");
        }

        function tileStyle(tile) {
            return {
                gridColumn: `${tile.col} / span ${tile.colSpan}`,
                gridRow: `${tile.row} / span ${tile.rowSpan}`
            };
        }

        function chunkAssets(assets, size) {
            const groups = [];
            for (let i = 0; i < assets.length; i += size) {
                groups.push(assets.slice(i, i + size));
            }
            return groups;
        }

        async function fetchGalleryAssets(folder) {
            const response = await fetch(`/gallery-assets?folder=${encodeURIComponent(folder)}`);

            if (!response.ok) {
                throw new Error(`Asset lookup failed with status ${response.status}`);
            }

            const payload = await response.json();
            const resources = Array.isArray(payload.resources) ? payload.resources : [];
            return resources
                .map((resource) => ({
                    publicId: resource && resource.public_id,
                    width: Number(resource && resource.width),
                    height: Number(resource && resource.height)
                }))
                .filter((asset) => typeof asset.publicId === "string" && asset.publicId.length > 0)
                .slice(0, 36);
        }

        async function fetchWithFolderFallback(primaryFolder, fallbackFolder) {
            try {
                const assets = await fetchGalleryAssets(primaryFolder);
                if (assets.length) {
                    return { assets, folderUsed: primaryFolder };
                }
            } catch (error) {
                // If primary lookup fails, we retry with a fallback folder name.
            }

            const fallbackAssets = await fetchGalleryAssets(fallbackFolder);
            return { assets: fallbackAssets, folderUsed: fallbackFolder };
        }

        function displayNameFromPublicId(publicId) {
            const chunk = publicId.split("/").pop() || publicId;
            return chunk.replace(/[-_]+/g, " ");
        }

        function setStatus(message) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.hidden = false;
        }

        function clearStatus() {
            const status = document.getElementById("status");
            status.hidden = true;
            status.textContent = "";
        }

        async function renderGridHoverGallery() {
            const gridStack = document.getElementById("grid-stack");

            if (!cloudName) {
                setStatus("Cloudinary cloud name is not configured. Set CLOUDINARY_CLOUD_NAME in your server environment.");
                return;
            }

            try {
                const { assets, folderUsed } = await fetchWithFolderFallback(folderName, "smallkitchen");

                if (!assets.length) {
                    setStatus(`No assets found in folder: ${folderName}`);
                    return;
                }

                clearStatus();

                if (folderUsed !== folderName) {
                    setStatus(`Using fallback folder: ${folderUsed}`);
                }

                const groups = chunkAssets(assets, TILE_LAYOUT.length);
                gridStack.innerHTML = "";

                groups.forEach((group, groupIndex) => {
                    const gridWall = document.createElement("div");
                    gridWall.className = "grid-wall";
                    gridWall.setAttribute("role", "group");
                    gridWall.setAttribute("aria-label", `Gallery group ${groupIndex + 1}`);

                    const tiles = group.map((asset, index) => {
                        const tile = TILE_LAYOUT[index];
                        const maxWidth = Number.isFinite(asset.width) && asset.width > 0
                            ? Math.round(asset.width)
                            : 3600;
                        const srcSetWidths = srcSetWidthsForMax(maxWidth);
                        const fullSrc = cloudinaryBestSrc(asset.publicId, maxWidth, { cropMode: "limit" });
                        const fullSrcSet = cloudinarySrcSet(asset.publicId, srcSetWidths, { cropMode: "limit" });

                        return {
                            ...tile,
                            publicId: asset.publicId,
                            sourceWidth: Number.isFinite(asset.width) ? Math.round(asset.width) : null,
                            sourceHeight: Number.isFinite(asset.height) ? Math.round(asset.height) : null,
                            maxWidth,
                            maxSrc: fullSrc,
                            srcSetWidths,
                            restSrc: fullSrc,
                            restSrcSet: fullSrcSet,
                            focusSrc: fullSrc,
                            focusSrcSet: fullSrcSet,
                            focusScale: focusScaleForImage(asset, tile)
                        };
                    });

                    let activeIndex = -1;
                    const itemButtons = [];
                    let touchGestureState = null;
                    let mouseDragState = null;

                    function getTouchTransform(button) {
                        const image = button.querySelector(".grid-thumb");
                        if (!image) {
                            return { zoom: 1, panX: 0, panY: 0 };
                        }

                        const zoom = Number(image.dataset.touchZoom || "1");
                        const panX = Number(image.dataset.touchPanX || "0");
                        const panY = Number(image.dataset.touchPanY || "0");

                        return {
                            zoom: Number.isFinite(zoom) ? zoom : 1,
                            panX: Number.isFinite(panX) ? panX : 0,
                            panY: Number.isFinite(panY) ? panY : 0
                        };
                    }

                    function applyTouchTransform(button, transform) {
                        const image = button.querySelector(".grid-thumb");
                        if (!image) {
                            return;
                        }

                        image.dataset.touchZoom = String(transform.zoom);
                        image.dataset.touchPanX = String(transform.panX);
                        image.dataset.touchPanY = String(transform.panY);
                        image.style.setProperty("--touch-zoom", String(transform.zoom));
                        image.style.setProperty("--touch-pan-x", `${transform.panX.toFixed(2)}px`);
                        image.style.setProperty("--touch-pan-y", `${transform.panY.toFixed(2)}px`);
                    }

                    function resetTouchTransform(button) {
                        applyTouchTransform(button, { zoom: 1, panX: 0, panY: 0 });
                        button.classList.remove("is-touch-gesturing");
                    }

                    function touchDistance(firstTouch, secondTouch) {
                        return Math.hypot(secondTouch.clientX - firstTouch.clientX, secondTouch.clientY - firstTouch.clientY);
                    }

                    function touchCenter(firstTouch, secondTouch) {
                        return {
                            x: (firstTouch.clientX + secondTouch.clientX) / 2,
                            y: (firstTouch.clientY + secondTouch.clientY) / 2
                        };
                    }

                    function clampPan(button, transform) {
                        const frameWidth = Math.max(1, button.clientWidth);
                        const frameHeight = Math.max(1, button.clientHeight);
                        const focusScale = Number(button.style.getPropertyValue("--focus-scale") || "1.03") || 1.03;
                        const effectiveScale = Math.max(1, focusScale * transform.zoom);
                        const imageAspect = Number(button.dataset.imageAspect || "0");
                        const safeImageAspect = Number.isFinite(imageAspect) && imageAspect > 0
                            ? imageAspect
                            : frameWidth / frameHeight;
                        const tileAspect = frameWidth / frameHeight;

                        let coverWidth = frameWidth;
                        let coverHeight = frameHeight;

                        if (safeImageAspect > tileAspect) {
                            coverWidth = frameHeight * safeImageAspect;
                            coverHeight = frameHeight;
                        } else {
                            coverWidth = frameWidth;
                            coverHeight = frameWidth / safeImageAspect;
                        }

                        const edgeSafetyPx = 1.5;
                        const maxPanX = Math.max(0, (coverWidth - frameWidth / effectiveScale) / 2 - edgeSafetyPx / effectiveScale);
                        const maxPanY = Math.max(0, (coverHeight - frameHeight / effectiveScale) / 2 - edgeSafetyPx / effectiveScale);

                        return {
                            zoom: transform.zoom,
                            panX: Math.max(-maxPanX, Math.min(maxPanX, transform.panX)),
                            panY: Math.max(-maxPanY, Math.min(maxPanY, transform.panY))
                        };
                    }

                    function updateGridState() {
                        const hoveredTile = tiles.find((tile) => tile.id === activeIndex) || null;
                        gridWall.style.gridTemplateColumns = tracksForAxis(hoveredTile, "col");
                        gridWall.style.gridTemplateRows = tracksForAxis(hoveredTile, "row");
                        gridWall.classList.toggle("is-hovering", activeIndex !== -1);

                        itemButtons.forEach((button) => {
                            const id = Number(button.dataset.tileId);
                            button.classList.toggle("is-focused", id === activeIndex);

                            const tile = tiles.find((entry) => entry.id === id);
                            const image = button.querySelector(".grid-thumb");

                            if (!tile || !image) {
                                return;
                            }

                            if (id === activeIndex) {
                                const transformState = getTouchTransform(button);
                                if (transformState.zoom > 1.001) {
                                    image.srcset = "";
                                    image.src = tile.maxSrc;
                                    image.dataset.forcedMaxRes = "1";
                                } else {
                                    image.srcset = tile.focusSrcSet;
                                    image.src = tile.focusSrc;
                                    delete image.dataset.forcedMaxRes;
                                }
                                button.style.setProperty("--focus-scale", tile.focusScale);
                            } else {
                                image.srcset = tile.restSrcSet;
                                image.src = tile.restSrc;
                                button.style.removeProperty("--focus-scale");
                                delete image.dataset.forcedMaxRes;
                                resetTouchTransform(button);
                            }
                        });
                    }

                    function clearHoverMotion() {
                        if (mouseDragState && mouseDragState.button) {
                            mouseDragState.button.classList.remove("is-touch-gesturing");
                        }
                        activeIndex = -1;
                        touchGestureState = null;
                        mouseDragState = null;
                        updateGridState();
                    }

                    function beginMouseDrag(button, tileId, event) {
                        if (event.button !== 0) {
                            return;
                        }

                        applyHoverMotion(tileId);
                        const startTransform = getTouchTransform(button);
                        mouseDragState = {
                            tileId,
                            button,
                            startX: event.clientX,
                            startY: event.clientY,
                            startZoom: startTransform.zoom,
                            startPanX: startTransform.panX,
                            startPanY: startTransform.panY
                        };
                        button.classList.add("is-touch-gesturing");
                        event.preventDefault();
                    }

                    function handleMouseDragMove(event) {
                        if (!mouseDragState) {
                            return;
                        }

                        const nextPanX = mouseDragState.startPanX + (event.clientX - mouseDragState.startX);
                        const nextPanY = mouseDragState.startPanY + (event.clientY - mouseDragState.startY);
                        const clamped = clampPan(mouseDragState.button, {
                            zoom: mouseDragState.startZoom,
                            panX: nextPanX,
                            panY: nextPanY
                        });

                        applyTouchTransform(mouseDragState.button, clamped);
                        event.preventDefault();
                    }

                    function endMouseDrag(event) {
                        if (!mouseDragState) {
                            return;
                        }

                        const draggedButton = mouseDragState.button;
                        draggedButton.classList.remove("is-touch-gesturing");
                        mouseDragState = null;

                        if (event && !gridWall.matches(":hover")) {
                            clearHoverMotion();
                        }
                    }

                    function handleWheelZoom(button, tileId, event) {
                        applyHoverMotion(tileId);

                        const tile = tiles.find((entry) => entry.id === tileId);
                        const image = button.querySelector(".grid-thumb");
                        const currentTransform = getTouchTransform(button);
                        const zoomFactor = Math.exp(-event.deltaY * 0.0015);
                        const nextZoom = Math.max(1, Math.min(4, currentTransform.zoom * zoomFactor));

                        const clamped = clampPan(button, {
                            zoom: nextZoom,
                            panX: currentTransform.panX,
                            panY: currentTransform.panY
                        });

                        applyTouchTransform(button, clamped);

                        if (tile && image) {
                            if (clamped.zoom > 1.001) {
                                image.srcset = "";
                                image.src = tile.maxSrc;
                                image.dataset.forcedMaxRes = "1";
                            } else if (image.dataset.forcedMaxRes === "1") {
                                image.srcset = tile.focusSrcSet;
                                image.src = tile.focusSrc;
                                delete image.dataset.forcedMaxRes;
                            }
                        }

                        event.preventDefault();
                    }

                    function applyHoverMotion(focusIndex) {
                        activeIndex = focusIndex;
                        updateGridState();
                    }

                    tiles.forEach((tile) => {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.className = "grid-item";
                        button.dataset.tileId = String(tile.id);
                        button.setAttribute("aria-label", tile.label || displayNameFromPublicId(tile.publicId));

                        const style = tileStyle(tile);
                        button.style.gridColumn = style.gridColumn;
                        button.style.gridRow = style.gridRow;
                        if (tile.sourceWidth && tile.sourceHeight) {
                            button.dataset.imageAspect = String(tile.sourceWidth / tile.sourceHeight);
                        }

                        const thumb = document.createElement("img");
                        thumb.className = "grid-thumb";
                        thumb.alt = tile.label || displayNameFromPublicId(tile.publicId);
                        thumb.draggable = false;
                        thumb.loading = "lazy";
                        thumb.sizes = galleryImageSizes();
                        thumb.srcset = tile.restSrcSet;
                        thumb.src = tile.restSrc;
                        thumb.addEventListener("load", () => {
                            if (thumb.naturalWidth > 0 && thumb.naturalHeight > 0) {
                                button.dataset.imageAspect = String(thumb.naturalWidth / thumb.naturalHeight);
                            }
                        });

                        const label = document.createElement("div");
                        label.className = "tile-label";
                        label.textContent = tile.sourceWidth && tile.sourceHeight
                            ? `${tile.sourceWidth} x ${tile.sourceHeight}`
                            : "Unknown size";

                        button.appendChild(thumb);
                        button.appendChild(label);
                        button.addEventListener("mouseenter", () => applyHoverMotion(tile.id));
                        button.addEventListener("focus", () => applyHoverMotion(tile.id));
                        button.addEventListener("mousedown", (event) => beginMouseDrag(button, tile.id, event));
                        button.addEventListener("wheel", (event) => handleWheelZoom(button, tile.id, event), { passive: false });
                        button.addEventListener("dragstart", (event) => event.preventDefault());
                        button.addEventListener("touchstart", (event) => {
                            if (event.touches.length === 1) {
                                applyHoverMotion(tile.id);
                                return;
                            }

                            if (event.touches.length === 2) {
                                applyHoverMotion(tile.id);
                                const [firstTouch, secondTouch] = event.touches;
                                const startTransform = getTouchTransform(button);
                                touchGestureState = {
                                    tileId: tile.id,
                                    startDistance: touchDistance(firstTouch, secondTouch),
                                    startCenter: touchCenter(firstTouch, secondTouch),
                                    startZoom: startTransform.zoom,
                                    startPanX: startTransform.panX,
                                    startPanY: startTransform.panY
                                };
                                button.classList.add("is-touch-gesturing");
                                event.preventDefault();
                            }
                        }, { passive: false });

                        button.addEventListener("touchmove", (event) => {
                            if (!touchGestureState || touchGestureState.tileId !== tile.id || event.touches.length !== 2) {
                                return;
                            }

                            const [firstTouch, secondTouch] = event.touches;
                            const nextDistance = touchDistance(firstTouch, secondTouch);
                            const nextCenter = touchCenter(firstTouch, secondTouch);
                            const distanceRatio = touchGestureState.startDistance > 0
                                ? nextDistance / touchGestureState.startDistance
                                : 1;
                            const nextZoom = Math.max(1, Math.min(3, touchGestureState.startZoom * distanceRatio));
                            const nextPanX = touchGestureState.startPanX + (nextCenter.x - touchGestureState.startCenter.x);
                            const nextPanY = touchGestureState.startPanY + (nextCenter.y - touchGestureState.startCenter.y);
                            const clamped = clampPan(button, {
                                zoom: nextZoom,
                                panX: nextPanX,
                                panY: nextPanY
                            });

                            applyTouchTransform(button, clamped);

                            const image = button.querySelector(".grid-thumb");
                            if (image) {
                                if (clamped.zoom > 1.001) {
                                    image.srcset = "";
                                    image.src = tile.maxSrc;
                                    image.dataset.forcedMaxRes = "1";
                                } else if (image.dataset.forcedMaxRes === "1") {
                                    image.srcset = tile.focusSrcSet;
                                    image.src = tile.focusSrc;
                                    delete image.dataset.forcedMaxRes;
                                }
                            }

                            event.preventDefault();
                        }, { passive: false });

                        button.addEventListener("touchend", (event) => {
                            if (!touchGestureState || touchGestureState.tileId !== tile.id) {
                                return;
                            }

                            if (event.touches.length >= 2) {
                                const [firstTouch, secondTouch] = event.touches;
                                const currentTransform = getTouchTransform(button);
                                touchGestureState = {
                                    tileId: tile.id,
                                    startDistance: touchDistance(firstTouch, secondTouch),
                                    startCenter: touchCenter(firstTouch, secondTouch),
                                    startZoom: currentTransform.zoom,
                                    startPanX: currentTransform.panX,
                                    startPanY: currentTransform.panY
                                };
                                return;
                            }

                            button.classList.remove("is-touch-gesturing");
                            touchGestureState = null;
                        });

                        button.addEventListener("touchcancel", () => {
                            button.classList.remove("is-touch-gesturing");
                            touchGestureState = null;
                        });

                        itemButtons.push(button);
                        gridWall.appendChild(button);
                    });

                    document.addEventListener("mousemove", handleMouseDragMove);
                    document.addEventListener("mouseup", endMouseDrag);
                    gridWall.addEventListener("mouseleave", () => {
                        if (!mouseDragState) {
                            clearHoverMotion();
                        }
                    });
                    gridWall.addEventListener("focusout", (event) => {
                        if (!gridWall.contains(event.relatedTarget)) {
                            clearHoverMotion();
                        }
                    });

                    updateGridState();
                    gridStack.appendChild(gridWall);
                });
            } catch (error) {
                setStatus(`Unable to load gallery assets: ${error.message}`);
            }
        }

        renderGridHoverGallery();
    </script>
</body>
</html>
